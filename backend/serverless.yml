service: backend

useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  environment:
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
    JWT_SECRET: ${file(./.env):JWT_SECRET}
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}
  httpApi:
    cors: true

functions:
  register:
    handler: dist/functions/auth/register/index.handler
    events:
      - httpApi:
          path: /register
          method: post

  login:
    handler: dist/functions/auth/login/index.handler
    events:
      - httpApi:
          path: /login
          method: post

  getMenu:
    handler: dist/functions/getMenu/getMenu.handler
    events:
      - httpApi:
          path: /menu
          method: get

  createPaymentIntent:
    handler: dist/functions/createPaymentIntent.handler
    events:
      - httpApi:
          path: /create-payment-intent
          method: post
