
service: backend
useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1

  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
      allowedHeaders:
        - Content-Type
      allowedMethods:
        - GET
        - POST
        - DELETE

  environment:
    JWT_SECRET: ${env:JWT_SECRET}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:eu-north-1:*:table/cantina-db

functions:
  hello:
    handler: src/functions/index.handler
    events:
      - httpApi:
          path: /index
          method: get

  getMenu:
    handler: src/functions/menu.getMenu
    events:
      - httpApi:
          path: /menu
          method: get

  createMenu:
    handler: src/functions/menu.createMenu
    events:
      - httpApi:
          path: /menu
          method: post

  removeMenu:
    handler: src/functions/menu.removeMenu
    events:
      - httpApi:
          path: /menu/{id}
          method: delete
