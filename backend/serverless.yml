service: backend

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  environment:
    STRIPE_SECRET_KEY: ${file(./.env):STRIPE_SECRET_KEY} # <-- NY
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}
  httpApi:
    cors: true

functions:
  hello:
    handler: src/functions/index.handler
    events:
      - httpApi:
          path: /index
          method: get

  getMenu:
    handler: src/functions/getMenu/getMenu.handler
    events:
      - httpApi:
          path: /menu
          method: get

  createPaymentIntent: # <-- NY
    handler: src/functions/createPaymentIntent.handler
    events:
      - httpApi:
          path: /create-payment-intent
          method: post
