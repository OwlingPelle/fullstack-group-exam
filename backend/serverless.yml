
service: backend
useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1

  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
      allowedHeaders:
        - Content-Type
      allowedMethods:
        - GET
        - POST
        - DELETE

  environment:
    JWT_SECRET: ${env:JWT_SECRET}
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:eu-north-1:*:table/cantina-db

functions:
  register:
    handler: dist/functions/auth/register/index.handler
    events:
      - httpApi:
          path: /register
          method: post

  login:
    handler: dist/functions/auth/login/index.handler
    events:
      - httpApi:
          path: /login
          method: post

  getMenu:
    handler: dist/functions/getMenu/getMenu.handler
    events:
      - httpApi:
          path: /menu
          method: get

  createMenu:
    handler: dist/functions/menu.createMenu
    events:
      - httpApi:
          path: /menu
          method: post

  removeMenu:
    handler: dist/functions/menu.removeMenu
    events:
      - httpApi:
          path: /menu/{id}
          method: delete

  getPersonnel:
    handler: dist/functions/personel.getPersonnelHandler
    events:
      - httpApi:
          path: /personnel
          method: get

  savePersonnel:
    handler: dist/functions/personel.savePersonnelHandler
    events:
      - httpApi:
          path: /personnel
          method: post

  removePersonnel:
    handler: dist/functions/personel.removePersonnel
    events:
      - httpApi:
          path: /personnel/{id}
          method: delete

  getAdminAccount:
    handler: dist/functions/account.getAdminAccountHandler
    events:
      - httpApi:
          path: /account
          method: get

  saveAdminAccount:
    handler: dist/functions/account.saveAdminAccountHandler
    events:
      - httpApi:
          path: /account
          method: post

  createPaymentIntent:
    handler: dist/functions/createPaymentIntent.handler
    events:
      - httpApi:
          path: /create-payment-intent
          method: post
