# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ${file(./config.yml):org}
# "service" is the name of this project. This will also be added to your AWS resource names.
service: backend

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  environment:
    JWT_SECRET: ${file(./.env):JWT_SECRET}
  region : eu-north-1
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
  iam:
    role: ${file(./config.yml):role}
  # Tillåter att frontenden (på en annan adress) anropar API:t
  httpApi:
    cors: true

functions:

  register:
    handler: dist/functions/auth/register/index.handler
    events:
      - httpApi:
          path: /register
          method: post

  login:
    handler: dist/functions/auth/login/index.handler
    events:
      - httpApi:
          path: /login
          method: post

  getMenu:
    handler: dist/functions/getMenu/getMenu.handler
    events:
      - httpApi:
          path: /menu
          method: get
